name: Update Dashboard Data

on:
  schedule:
    # Run every day at 2 AM UTC (adjust timezone as needed)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Install Python dependencies
      run: |
        pip install requests beautifulsoup4
    
    - name: Update data
      run: |
        python3 fetch_google_sheet.py
        python3 fetch_full_api_data.py
        python3 fetch_transistor_podcast.py
        python3 merge_data.py
        python3 analyze_matchdays.py
      env:
        TRANSISTOR_API_KEY: ${{ secrets.TRANSISTOR_API_KEY }}
        TRANSISTOR_FEED_URL: https://feeds.transistor.fm/ajax-podcast
        FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}

    - name: Process new CDN datadumps (detailweergave per wedstrijd)
      # Verwerkt eventuele nieuwe ruwe streaminglogs uit de Azure "datadump"-
      # container tot per-wedstrijd detail-json (concurrency, platform, geo,
      # kwaliteit, pre-roll). Faalt niet de hele run als dit misgaat (bv. SAS-
      # token nog niet gezet) - de rest van de dashboard blijft dan gewoon werken.
      run: |
        python3 process_matchday.py process-all || echo "process_matchday.py overgeslagen of mislukt (zie hierboven)"
      env:
        AJAX_SAS_TOKEN: ${{ secrets.AJAX_SAS_TOKEN }}

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add dashboard/public/output/*.json dashboard/public/output/match_details/*.json
        git commit -m "Auto-update dashboard data" || exit 0
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
