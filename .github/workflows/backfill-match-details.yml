name: Backfill Match Details

# Handmatig te starten (Actions-tab -> Backfill Match Details -> Run workflow).
# Verwerkt een batch bekende wedstrijddagen waarvoor een ruwe CDN-dump
# beschikbaar is maar nog geen detail-json bestaat. process_matchday.py doet
# zelf de git add/commit/pull/push na ELKE wedstrijd (niet pas aan het eind),
# zodat er niks verloren gaat als een run vastloopt of de tijdslimiet raakt -
# gewoon nog een keer starten pakt de rest op.
#
# Standaard 20 wedstrijden per run (zie "limit" hieronder in te stellen bij
# het handmatig starten). Bij ~100 historische wedstrijden dus een paar keer
# opnieuw starten om alles te verwerken.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max. aantal wedstrijden deze run (0 = geen limiet)"
        required: false
        default: "20"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Python dependencies
      run: pip install requests

    - name: Git identiteit instellen
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Backfill draaien
      env:
        AJAX_SAS_TOKEN: ${{ secrets.AJAX_SAS_TOKEN }}
      run: |
        python3 process_matchday.py backfill --limit "${{ inputs.limit }}"
