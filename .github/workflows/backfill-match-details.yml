name: Backfill Match Details

# Handmatig te starten (Actions-tab -> Backfill Match Details -> Run workflow).
# Verwerkt alle bekende wedstrijddagen waarvoor een ruwe CDN-dump beschikbaar
# is maar nog geen detail-json bestaat. Committen en pushen gebeurt na ELKE
# afzonderlijke wedstrijd, zodat er niks verloren gaat als deze run door de
# tijdslimiet afbreekt - gewoon nog een keer starten pakt de rest op.

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Python dependencies
      run: pip install requests

    - name: Verwerk elke wedstrijd apart, met commit+push per wedstrijd
      env:
        AJAX_SAS_TOKEN: ${{ secrets.AJAX_SAS_TOKEN }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        python3 process_matchday.py list-new | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' > /tmp/dates.txt || true
        total=$(wc -l < /tmp/dates.txt | tr -d ' ')
        echo "Te verwerken wedstrijddagen: $total"

        count=0
        while read -r d; do
          count=$((count + 1))
          echo "=== [$count/$total] Verwerken: $d ==="
          if python3 process_matchday.py process --date "$d"; then
            git add dashboard/public/output/match_details
            if git commit -m "Wedstrijddetail toegevoegd: $d"; then
              git pull --no-edit --quiet origin main || true
              if ! git push origin main; then
                echo "Push mislukt voor $d, probeer na een pull opnieuw"
                git pull --no-edit --quiet origin main || true
                git push origin main || echo "Push nog steeds mislukt voor $d, ga door met de volgende"
              fi
            else
              echo "Niets te committen voor $d (ongewijzigd), ga door"
            fi
          else
            echo "FOUT bij verwerken van $d, ga door met de volgende"
          fi
        done < /tmp/dates.txt

        echo "Backfill klaar (of tijdslimiet bereikt). Draai de workflow nogmaals om eventuele resterende dagen op te pikken."
